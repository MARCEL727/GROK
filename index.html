<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARCEL // HACKER PROFILE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon: #00ff41;
            --neon-dim: #00cc33;
            --dark: #0a0a0a;
            --darker: #050505;
            --glow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #050505 url('https://iili.io/nqCh4Eu.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--neon);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Overlay dark agar teks tetap terbaca */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.75) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #ff0040, #ff8800, #ffff00, #00ff41, #00ffff, #0088ff, #ff00ff, #ff0040);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-move 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 255, 65, 0.5));
        }

        @keyframes rainbow-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Hamburger */
        .hamburger {
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--neon);
            transition: 0.3s;
            user-select: none;
            text-shadow: 0 0 8px var(--neon);
        }

        .hamburger:hover {
            color: #fff;
            text-shadow: 0 0 15px #fff;
        }

        /* Side Menu */
        .side-menu {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background: rgba(8, 12, 8, 0.97);
            border-left: 1px solid var(--neon);
            z-index: 200;
            transition: right 0.4s cubic-bezier(0.77, 0, 0.18, 1);
            padding: 80px 30px 30px;
            box-shadow: -10px 0 30px rgba(0, 255, 65, 0.15);
        }

        .side-menu.active {
            right: 0;
        }

        .side-menu a {
            display: block;
            color: var(--neon);
            text-decoration: none;
            font-size: 1.2rem;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .side-menu a:hover {
            color: #fff;
            padding-left: 15px;
            text-shadow: 0 0 10px var(--neon);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--neon);
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 10;
            padding-top: 90px;
            min-height: 100vh;
        }

        /* Hero / Beranda */
        #beranda {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            min-height: calc(100vh - 90px);
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            position: relative;
            text-shadow: var(--glow);
            margin-bottom: 10px;
        }

        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-title::before {
            left: 2px;
            text-shadow: -2px 0 #ff0040;
            clip-path: inset(0 0 50% 0);
            animation: glitch 2s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px;
            text-shadow: 2px 0 #00ffff;
            clip-path: inset(50% 0 0 0);
            animation: glitch 3s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 4px;
            opacity: 0.8;
            margin-bottom: 40px;
            border: 1px solid rgba(0, 255, 65, 0.4);
            padding: 8px 20px;
            display: inline-block;
        }

        /* Profile Card */
        .profile-card {
            background: rgba(0, 20, 5, 0.75);
            border: 1px solid var(--neon);
            border-radius: 4px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15), inset 0 0 20px rgba(0, 255, 65, 0.05);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .profile-img-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
            position: relative;
        }

        .profile-img-wrapper::before {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px solid var(--neon);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--neon);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.5);
            background: #111;
        }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px var(--neon);
        }

        .status {
            font-size: 0.95rem;
            color: var(--neon-dim);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .status::before {
            content: '● ';
            color: #00ff41;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            text-align: left;
            font-size: 0.9rem;
        }

        .info-item {
            background: rgba(0, 255, 65, 0.05);
            padding: 10px 12px;
            border-left: 2px solid var(--neon);
        }

        .info-item span {
            display: block;
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 3px;
        }

        /* Social Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 30px 0 10px;
        }

        .social-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid var(--neon);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 20, 5, 0.7);
            color: var(--neon);
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.3);
        }

        .social-btn:hover {
            background: var(--neon);
            color: #000;
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.7);
        }

        .social-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* Terminal-like footer */
        .terminal {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(0, 255, 65, 0.3);
            padding: 15px 20px;
            max-width: 500px;
            width: 100%;
            font-size: 0.9rem;
            text-align: left;
        }

        .terminal .prompt {
            color: #00ff41;
        }

        .terminal .cmd {
            color: #fff;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background: var(--neon);
            margin-left: 4px;
            animation: cursor-blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes cursor-blink {
            50% { opacity: 0; }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            font-size: 0.8rem;
            opacity: 0.5;
            position: relative;
            z-index: 10;
            border-top: 1px solid rgba(0, 255, 65, 0.15);
        }

        /* Responsive */
        @media (max-width: 500px) {
            .profile-card {
                padding: 30px 20px;
            }
            .name {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            WEBSITE
        </div>
        <div class="hamburger" onclick="toggleMenu()">≡</div>
    </nav>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <a href="#beranda" onclick="toggleMenu()">⌂ BERANDA</a>
    </div>

    <!-- Main Content -->
    <main>
        <section id="beranda">
            <h1 class="glitch-title" data-text="MARCEL">MARCEL</h1>
            <div class="subtitle">🇮🇩 WEBSITE GAMES INDONESIA 🇮🇩</div>

            <div class="profile-card" id="profil">
                <div class="profile-img-wrapper">
                    <img src="https://iili.io/nqC5EYu.png" 
                         alt="Marcel Profile" 
                         class="profile-img"
                         onerror="this.src='https://via.placeholder.com/160/00ff41/000000?text=M'">
                </div>
                
                <div class="name">MARCEL</div>
                <div class="status">ONLINE • WEBSITE READY</div>

                <div class="info-grid">
                    <div class="info-item">
                        <span>STATUS</span>
                        ONLINE
                    </div>
                    <div class="info-item">
                        <span>FPS</span>
                        <span id="fps-value">--</span>
                    </div>
                    <div class="info-item">
                        <span>VERSION</span>
                        0.0.1.0
                    </div>
                    <div class="info-item">
                        <span>LOCATION</span>
                        Indonesia
                    </div>
                </div>
            </div>

            <!-- Social Media Logos -->
            <div class="social-links">
                <a href="https://www.tiktok.com/@marcel_gaming5" target="_blank" class="social-btn" title="TikTok">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .55.04.81.11v-3.5a6.37 6.37 0 0 0-.81-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.7a8.2 8.2 0 0 0 4.76 1.51V6.76a4.85 4.85 0 0 1-1.35-.07z"/>
                    </svg>
                </a>
                <a href="https://youtube.com/@yt.marcelindonesia?si=1QSn8KITg0cQkUjA" target="_blank" class="social-btn" title="YouTube">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </div>

            <div class="terminal">
                <div>
                    <span class="prompt">WEBSITE@ALLGAMERS:</span> 
                    <span class="cmd" id="typing-indo"></span><span class="cursor" id="cursor1"></span>
                </div>
                <div style="margin: 10px 0 0 0; color: #00ff41;">
                    <span id="typing-creator"></span><span class="cursor" id="cursor2" style="display:none;"></span>
                </div>
                <div style="margin-top: 12px;">
                    <span class="prompt">BOT@WEBSITE.COM:</span> 
                    <span class="cmd" id="typing-greet"></span><span class="cursor" id="cursor3" style="display:none;"></span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 • WEBSITE • ALLGAMERS • INDONESIA • BY • MARCEL
    </footer>

    <script>
        // ===== SIDE MENU =====
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
        }

        // ===== TYPING EFFECTS (sequential) =====
        function typeText(elementId, text, cursorId, speed = 70, callback) {
            const el = document.getElementById(elementId);
            const cursor = document.getElementById(cursorId);
            let i = 0;
            el.textContent = '';
            if (cursor) cursor.style.display = 'inline-block';

            function type() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    if (cursor) cursor.style.display = 'none';
                    if (callback) setTimeout(callback, 400);
                }
            }
            type();
        }

        // Greeting based on time (WIB)
        function getGreeting() {
            const hour = new Date().getHours();
            if (hour >= 4 && hour < 11) return 'SELAMAT PAGI';
            if (hour >= 11 && hour < 15) return 'SELAMAT SIANG';
            if (hour >= 15 && hour < 18) return 'SELAMAT SORE';
            return 'SELAMAT MALAM';
        }

        // Start typing sequence
        typeText('typing-indo', 'INDONESIA', 'cursor1', 90, function() {
            typeText('typing-creator', 'MARCEL // CREATORS WEBSITE: SELAMAT DATANG', 'cursor2', 55, function() {
                typeText('typing-greet', getGreeting(), 'cursor3', 80);
            });
        });

        // ===== FPS COUNTER =====
        let lastTime = performance.now();
        let frames = 0;
        let fps = 0;

        function updateFPS(now) {
            frames++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frames * 1000) / (now - lastTime));
                document.getElementById('fps-value').textContent = fps;
                frames = 0;
                lastTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
        requestAnimationFrame(updateFPS);
    </script>
</body>
</html>
